рега Белого моря и Соловецкий архипелаг. Любопытно, что Русским Севером эти земли стали именоваться сравнительно не давно (официально лишь в конце XIX века). И совершенно неправы те, кто считает Поморьем лишь побережье Белого моря. Поэтому мы с полным основанием называем нашу говОрю по морским языком, возникшим как над диалектное начало на территории исторического Поморья.","Словарь наша лоция","Краткий словарь поморского языка можно сравнить с традиционной поморской «Книгой мореходной» общим руководством для мореходов. Сначала наши предки передавали знания о землях и мореплавании в Арктике только устно от отца к сыну. Но многие уникальные знания при этом терялись, забывались. И тогда поморы стали записывать и объединять свои знания об окружающем их мире в рукописных лоциях. Поморские мореходные книги не были научными работами, их писали и составляли отнюдь не представители науки. Однако, благодаря этим лоциям, опыт предков удалось сохранить, и впоследствии собранные в них знания очень пригодились ученым исследователям Арктики, Сибири и даже Дальнего Востока, который тоже открывали поморы. А многие исконно поморские термины вошли в язык российской науки и литературного русского языка. Правила поморского языка помОрьской говори до недавнего времени также передавались в нашем народе естественным образом, исключительно благодаря той языковой культурной среде, в которой они жили. Никто специально не учил наших предков в школах тому, как правильно произносить слова, где ставить ударения, добавлять окончания, как использовать приставки, суффиксы, применять обороты речи, менять тональности в предложениях… Просто все знали, как звучит настоящая говОря, потому что она звучала повсюду в Поморье. Казалось, что поморская говоря будет звучать всегда, пока есть поморы. Но наше поколение подверглось самой большой ассимиляции в русской языковой культуре, оно выросло в иной языковой среде, чем наши предки. С детства в государственных школах нас учили говорить, писать и мыслить исключительно на русском языке. Об изучении в школах родной говОри не было и речи. Нас учили, что русский язык это, якобы, и есть наш родной язык, а язык наших бабушек и дедушек «пережиток прошлого», от которого надо избавляться. Никто не объяснял нам, что литературный русский язык это искусственный государственный язык, а наша помОрьска говОря это по настоящему родной живой язык, сокровище, которое надо беречь. В итоге, мы уже не можем так же свободно, как наши предки, общаться друг с другом на помОрьской говОре, мы не знаем и не помним многих слов, которые вытеснены из нашей речи. Чтобы вспомнить, как звучит говОря, мы уже не можем ориентироваться на окружающую языковую среду, где сегодня повсюду доминирует русская речь. Любой человек, живущий в иной этнической среде, постепенно теряет свой язык, приобретает иностранный акцент и начинает употреблять иностранные слова вместо родных слов. Чтобы не забыть окончательно язык наших предков, чтобы наши дети и внуки знали, как звучит этот язык, мы сами должны учить правила помОрьской говОри, и ее основные отличия от конкурирующего с ней русского языка. Образно говоря, нам пора составить языковую лоцию для нашего народа, собрать воедино разрозненные знания о нашем языке. Правила нашего языка уже не могут передаваться нам традиционным путем, из естественной окружающей нас поморской культурной среды, потому что эта среда боль шей частью разрушена. Поэтому мы сами должны теперь прилагать большие усилия, чтобы не забыть, как правильно говорить по поморски.","О мироощущении поморов","Явление поморской культуры понимается российскими исследователями очень однобоко, сведения о поморах разрозненны и скупы, а история их происхождения изучена крайне слабо. Представление о поморской этнической общности в русской среде основано на ложных стереотипах. Таково мнение самих коренных поморов. Увы, в XX веке эти стереотипы получили распространение и среди поморов, разрушая поморское этническое сознание, собственное традиционное мироощущение поморского народа. Ассимиляция породила массу безликих, утративших свои культурные корни «северян», уже не отождествляющих себя с поморским народом. Поморское этническое сознание традиционно подразумевает отдельный этнический статус независимого поморского народа, который живет по своим «дедовским» законам и придерживается собственных этических норм и правил поведения. Ассимиляция в великорусской этнической культуре означает для поморов собственную этническую деградацию. Сопротивление ассимиляции традиционно проявляется во всей поморской истории и культуре (сохранение запрещавшихся в России древних былин, строительство запрещенных в России шатровых храмов и часовен, сохранение запрещенного в России «древлего православия» и отказ от священников, отличный от российского Двинской Судебник, строительство запрещенных российским правительством традиционных поморских морских судов и т. д.) В том числе это сопротивление поморской общности общерусской обезличивающей ассимиляции традиционно проявляется и в поморском поведении (поморском характере) и в языке. Так, например, поморы считают оскорбительным русское обозначение женщины «баба», и никогда не употребляют это слово, считая его унизительным. Сами поморские женщины всегда называли друг друга исключительно «жОнками». Совсем еще недавно в поморских деревнях можно было услышать, как какой нибудь заезжий, обратившись к поморкам со словами: «Эй, бабы, где у вас сельсовет?», тут же получал презрительный ответ: «Мы не бабы, говорили поморки. Мы жОнки, а бабами то сваи бьют».","Древние корни ГовОри","О древности «говОри» красноречиво свидетельствуют слова, которые доказывают, что корни поморского языка лежат не в мифическом «древнерусском языке», а в более древних восточнославянских диалектах, которые и следует считать источниками возникновения помОрьской говОри. В традиционной помОрьской говОре не употребляется целый ряд слов, которые составляют основу русского языка. Например, вместо слова «работать» поморы говорят исключительно «рОбить», у них отсутствует слово «почему» только «поштО» (слово «потому» тоже отсутствует). В поморьской говОре слово «нет» употребимо только в форме отказа (Нет, не пойду). Но нет русского значения слова «нет» в смысле «отсутствует» только «немА» (У мя дрОвець немА)… Любопытно, что все эти древние слова мы можем найти в южных, украинских диалектах, которые сегодня отделены от поморьской говОри обширной территорией распространения литературного русского языка, русского просторечия и жаргонов. И это красноречиво свидетельствует о том, что говоря возникла очень давно и ее не надо путать с «северным диалектом русского языка», который по большому счету возник лишь в XX столетии и сегодня вытесняет собой истинную говОрю. Кроме того, в помОрьской говОре существует большое количество значений слов, которые в русском языке неизвестны и непонятны. Так, значение слов «жить», «живой» в поморьской говоре шире, чем в русском языке (в этих же значениях слова встречаются и в южных, украинских и белорусских диалектах):","СпИте, крешшОны?","Не спим, ЖИВЁМ! (т. е. «бодрствуем»),","ЖивОй стУльцикот дайко новОй (здесь «живой» подвижный, неустойчивый).","ЗдЕсека водА навекУ не ЖИВЁТ о большУ вОду сУхо («не живёт» значит «не бывает»).","У поморов снег всегда «пАдат», «дожжь лЕтит» или «льёт», но никогда не «идет», как в русском языке. Про ветер поморы скажут что он не «подул», а «пАл». Любопытно, что, несмотря на ассимиляцию, развитие традиционной говОри не остановилось и сегодня поморы говорят, что машина не едет, а «бежИт», не задавила кого то, а «растоптАла» в больницу больного не положили, а «повалИли»… Живут и сегодня в Поморье такие слова, как «сЕйгод», «поштО» «порАто» и масса других слов. Так что язык поморский вовсе не исчезает исчезают только его носители, люди, осознающие себя поморами, которых становится все меньше. Поэтому очень важно успеть не просто записать эти слова и выражения, а осмыслить их, и сохранить живой язык поморов, как часть мировой языковой культуры."],"pm1":["Поморы — отличительное национальное самоназвание (этноним) представителей коренной этнической общности европейского Севера России (Поморья). Название «поморы» возникло не позднее X–XII вв, предположительно на юго-западном (Поморском) берегу Белого моря, и в течение XIV–XVI вв распространилось далеко на юг и восток от места своего возникновения. Этногенез поморов был обусловлен слиянием культур протопоморских, преимущественно угро-финских (чудских) племен Беломорья и первых восточных словен-колонистов, активно заселявших территории чудского Заволочья, BXII–XVBB. Поморье было колонией Великого Новгорода. В XVXVII вв. Поморьем назывался обширный экономический и административный район по берегам Белого моря, Онежского озера и по pp. Онега, Северная Двина, Мезень, Пинега, Печора, Кама и Вятка, вплоть до Урала. К началу XVI века Поморье присоединилось к Москве. В XVII веке в 22 уездах Поморья основную массу населения составляли свободные от помещиков и крепостной зависимости «черносошные» поморские крестьяне. В XIX веке Поморье стали также называть Русским Севером, европейским севером России и т. д. Впоследствии термин Поморье стал размываться, этноним «поморы» начал вытесняться обезличенным термином «северяне», однако несмотря на активные процессы ассимиляции поморов в великорусском этносе (этноним великороссы возник в XIX веке), поморы сохранили свое этническое (национальное) самосознание до наших дней. Факт существования поморского самосознания, в частности, подтверждают данные всероссийской переписи населения 2002 года, где поморы указывали свою этническую принадлежность в графе «национальность» (реестровый код переписи № 208 «национальность- помор»). Признаками этнической общности поморов являются: этническое (национальное) самосознание и самоназвание (этноним) «поморы», общность исторической территории (Поморье), общность культуры исторического Поморья (Русского Севера), общность языка (поморская «говоря»), этнический характер поморов, этническое религиозное мировоззрение (Поморская древлеправославная церковь), общность традиционной экономики и другие факторы.","В.Н. БУЛАТОВ, доктор ист. наук, профессор Поморского государственного университета, советник министра образования РФ","Н.М. ТЕРЕБИХИН, доктор ист. наук, профессор Поморского государственного университета"],"pm2":["ГовОря — это язык народа поморов, в котором нашли свое отражение практически все диалекты исторического Поморья. Нынешние коренные жители поморского края являются последним поколением, которое ещё слышало живую говОрю и способно хотя бы частично понимать её слова и выражения. С уходом из жизни наших родителей, дедушек и бабушек, поморское слово может навсегда исчезнуть из памяти потомков, превратившись в «язык мертвых». В истории международного сообщества есть примеры, когда народы, потерявшие культуру и язык своих предков, под угрозой полного истребления и исчезновения возрождали утраченное, и возрождались сами. Мы тоже обязаны сохранить языковое наследие наших предков, потому что наш поморский народ — это часть человечества, а его язык — достояние мировой культуры. Не знать языка собственных предков позори беда для мыслящего, уважающего себя человека. На своей земле надо говорить на своем языке. Как говорил российский философ Георгий Плеханов: «архангельский мужик стал разумен и велик не только «по своей и Божьей воле». Ему чрезвычайно помогло то обстоятельство, что он был именно архангельским мужиком поморцем, не носившим крепостного ошейника» (Плеханов Г. В. Соч., т. 21, М.Л., 1925, с. 141). ПомОрьска говОря является основным носителем исторического этнического сознания поморов, в ней находят свое отражение глубокие культурные традиции и непростая история коренного населения Поморья. Знаменитый исследователь российского севера Сергей Максимов писал: «Прислушиваясь к говору, трудно отличить поселенцев одной местности от другой, тем более, что говор имеет по всему северному краю поразительное сродство и сходство.» (С. В. Максимов, СЗКИ, 1984 «Год на Севере», с. 545) Исторически говОря была языком наддиапектного, межнационального общения народов чудского Заволочья и Поморья. Говоря относится к группе архаичных восточнославянских надплеменных языков и история ее возникновения до сих пор не изучена. Известно, что в ХХII вв. выходцы из Новгородской земли (словене и корела) колонизировали преимущественно юго западное побережье Белого моря (Поморский, Кандалакшский и южную часть Корельского берегов). А в низовьях Северной Двины, на Летнем Терском и в южной части Зимнего берега Белого моря оседало Верхневолжское угрофиннское и славянское население. Кроме того, тот и другой этнический потоки содержали в себе весьма значительный контингент финноугорских народов Приильменского края и ВолгоОкского междуречья. О причинах распространения славянской культуры среди чудского неславянского населения Заволочья написано немало, и во многом славянский язык распространялся вместе с христианством православием. По мнению В.И.Даля, говор Архангелогородской губернии имеет родство с другими говорами севера России (исторического Поморья) и содержит свидетельства глубокой древности: «В губернии этой довольно много малорусских слов, между прочим всегда говорят «рОбить» вместо «работать», «орАть» вместо «пахать», а это слово (пахАть) значит «подметать», «мести». (Даль В.И. «Толковый словарь живаго великорусскаго языка», Изд. Книгопродавцатипографа М.О. Вольфа, 1880, стр. LXVIII).","Но поразительное наддиалектное сродство и сходство поморских наречий, отмеченное и Максимовым, и Далем, и другими исследователями, действительно неоспоримый факт. Объясняется такое сходство длительной исторической, географической и политической обособленностью Поморья, а также многовековой ежегодной сезонной миграцией населения по территории края, связанной с отхожими промыслами. Кроме того, можно уверенно говорить о том, что говОря во многом формировалась на морских промыслах, в которых ежегодно принимало участие почти все мужское население большинства районов исторического Поморья (Вятки, Тотьмы, Чаронды, Каргополя, Великого Устюга, Пинеги, Мезени, Онеги, Архангельска и других). Наряду с промыслами, в формировании языковой общности большую роль сыграли речные и сухопутные торговые пути поморов. В результате происходило постоянное смешивание поморских диалектов и консолидация их в единое над диалектное целое говОрю.","ПОМОРЬСКА ГОВОРЯ И РУССКИЙ ЯЗЫК","Российские ученые использовали поморскую говорю для составления правил официального российского (великорусского, русского) языка. Так, в XVIII веке великий российский ученый и помор по происхождению Михаиле Ломоносов впервые выделил три «главных диалекта, из которых составлен российский язык» «московский», «малороссийский» (украинский) и «поморский». Кстати, Ломоносов никогда не называл искусственно созданную им и другими отечественными учеными языковую систему «русским языком» только «российским», прекрасно понимая, что это не этнический, а надэтнический официальный, государственный язык. Понятие «литературный русский язык» для этой языковой системы было введено значительно позже. Таким образом, совершенно очевидно, что поморская «говОря» не является производным (диалектом) от искусственного русского (российского) языка. Это так же очевидно, как и то, что древний латинский язык не является диалектом итальянского. В своих черновых заметках «О диалектах» Михаиле Ломоносов особо выделял родной «поморский» говор, подчеркивая, что он «не сколько ближе к старому словенскому и великую часть России занял» (М.В.Ломоносов. ПСС. Изд. Академии НаукСССР, т. VII. М.Л., 1952 г, стр. 608). Не случайно мы сегодня находим поморские слова и выражения по всей Сибири и Дальнему Востоку эти земли, задолго до возникновения российского государства, столетиями осваивались поморами. Ломоносов прекрасно осознавал механизм образования литературного российского языка, стремился оживить и облагородить его родными поморскими словами. Частично ему это удалось, и многие морские термины поморов сегодня используются российской наукой. Но в целом эта идея Ломоносова не была должным образом понята и принята.","МЫ САМИ ПО СЕБЕ","Официальное неприятие поморьской говОри началось еще во времена Ломоносова. Так, «один из основателей языка российского» Сумароков обвинил холмогорского помора в том, что тот, мол, принес в литературный российский язык множество «подлых холмогорских слов». В частности, одно из его обвинений в адрес Ломоносова выглядело следующим образом: «Строфа XII О коль согласно там бряцает… Бряцает и бренчит есть слово самое подлое;…и есть слово новомышленное и подло как выговором, так и знаменованием», написал Сумароков. Однако стоит заметить, что внедренные самим Сумароковым литературные нормы русского языка взяты из московского просторечия, иными словами литературный русский язык создан на основе языка крепостной, московской России. Так что слово «подлый» (т. е. низкий, неблагородный и т. д.) более подходит для характеристики именно официального русского языка, нежели для помОрьской говОри языка народа поморов, никогда не знавшего крепостной зависимости от русских помещиков. Любопытно, что поморы даже не считали Поморье частью России, а с XVIII века по благословению монахов старообрядцев Соловецкого монастыря (впоследствии уничтоженных по приказу российского самодержца) поморское население перестало молиться за российского царя. Соловецкий кремль, построенный поморским архитектором Трифоном, выходцем из села Нёнокса, был опорой поморского сопротивления, и здесь возникла Поморская вера беспоповцев старообрядчество, которое не признает священников. Официальная российская история не акцентирует внимание на подобных фактах, которые прямо доказывают, что поморы это самостоятельный народ. Поморы вплоть до XX века сохраняли свою самобытность и этническое самосознание, стремились обособиться от подавляющей их феодально самодержавной «великорусской» культуры, активно отделяя себя от остальной России. Это нашло отражение даже в записках М.М. Пришвина, путешествовавшего летом 1907года по Северу царской России и беседовавшего с коренными поморами:","«Почему же вы отделяете себя от России? говорил я, Вы тоже русские…».","Мы не от России дышим! Впереди вода, сзади мох… Мы сами по себе», отвечали Пришвину поморы. (Пришвин М.М., «За волшебным колобком. Из записок на крайнем севере России и Норвегии». Изд. Петрозаводск. Карелия. 1987 г, с.293).","Конечно, такое независимое самосознание подверглось сильнейшему давлению со стороны государства, особенно в годы советской диктатуры в СССР.","ВОПРЕКИ АССИМИЛЯЦИИ","Поморы не имели права на существование и развитие в качестве самостоятельного коренного народа в российском государстве, а их культура и язык практически не изучались учеными. В советских школах поморских детей учили говорить «правильно», а родной язык изначально признавался «неправильным» и подлежал искоренению, как ненужный «пережиток прошлого». Запрещалось употреблять «диалектные» поморские слова и выражения в присутственных местах и в средствах массовой информации. Даже в художественной литературе дозволялась лишь умеренная стилизация под народный поморский язык (см. произведения Степана Писахова, Бориса Шергина, Федора Абрамова). Массовые переселения ссыльных каторжан на «севера» в период существования СССР привели к тому, что помимо воздействия литературного русского языка, говОря подверглась мощному влиянию усредненного российского просторечия, к середине XX века почти утратив свои наиболее характерные отличительные черты. Смешение двух трех языковых систем (русского языка, российского просторечия и родной помОрьской говОри) в то время было характерным явлением для населения Поморья. Увы, политика изживания разнообразных «пережитков», отсутствие у поморов статуса и прав самостоятельной этнической общности, а также целый ряд других крайне неблагоприятных факторов привели к тому, что преобладающей (из числа названной выше тройки языковых систем) в Поморье сегодня является усредненное российское просторечие с редкими элементами диалектных особенностей. По прежнему жесткой корректуре и искажению подвергаются слова, которые совсем недавно были широко распространены на территории поморского края и могли бы без ущерба для привнесенной извне великорусской языковой культуры существовать в региональных средствах массовой информации и в литературе. Искажается даже традиционная топонимика Поморья. (Например: историческое поморское название деревни Малые Корелы архангельские власти пишут в соответствии с правилами русского языка через букву «а» Малые КАрелы. Двусловный слитный поморский топоним Кегостров пишут порусски «остров Кего», название реки Виткурье (курье попоморски означает «слепой рукав реки») пишут как Виткурья, поморское название села Долгошшелье произносят и пишут через букву щ, как Долгощелье), и т. д. Впрочем, ассимиляция в русском языке началась еще пару столетий назад, когда, например, древнее поморское название села Колмогоры превратилось в русифицированное Холмогоры). Да что говорить: даже мою собственную поморскую фамилию Мосеев (с редуцированной буквой и), нередко произносят и записывают как Моисеев, адаптируя ее к русскому языку. А «истовЁнно помОрьски» имена Мосей, Иринья, Еликанида, Северьян и другие, в XX веке вовсе исчезли из употребления. Остатки этнической речевой культуры поморов сегодня еще сохранились в отдаленных уголках Архангельской области, но говорить о широком сохранении языковой системы уже не приходится. Тем не менее, периодические изменения в государственной российской политике дают поморам шанс на сохранение и возрождение своей этнической культуры.","САМОСТОЯТЕЛЬНЫЙ ЯЗЫК","Российские, и позже, советские филологи долго придерживались концепции «материнского языка», согласно которой некогда существовал единый «материнский» древнерусский язык, от которого, якобы, возникли все региональные «русские диалекты». Такая концепция, возникшая в XVIII веке, была нужна с политической точки зрения, она помогала консолидировать этносы в единый российский народ, укреплять Российскую империю. Но сегодня среди отечественных филологов уже получила развитие и другая точка зрения: считается, что часть так называемых диалектов это не ответвления от русского языка, а самостоятельные в прошлом языки народов (вятичей, кривичей, северян, дреговичей и т. д.), утративших позже свое этническое самосознание и ассимилированных великорусской этнической общностью. Очевидно, что, в отличие от перечисленных древних народов, поморы не прервали свою традицию, не утратили своего этнического самосознания, и даже сохранили название своего народа «поморы». Поэтому «помОрьску говорю» нельзя считать одним из русских диалектов. Это по прежнему самостоятельный язык отдельного народа. Увы, задача советских филологов и этнографов сводилась лишь к тому, чтобы записать умирающие языковые «пережитки», но о сохранении и развитии языковых традиций Поморья не было и речи. Мнения самих поморов на этот счет никто никогда не спрашивал, а сама говОря активно изживалась в учебных заведениях, как «неправильный русский» язык. Словарей и учебных пособий для широкого круга читателей, которые могли бы помочь молодым поморам овладеть языковыми традициями своего народа, никогда не издавалось.","«ГовОря помОрьска»","язык коренной этнической общности поморов","Единой точки зрения при различении языка и диалекта в мировой научной практике не существует. По мнению отечественных филологов, «наличие у территориальных диалектов своей целостной системы сближает их с языками и объясняет трудность разграничения языков и диалектов, и сложность процессов, переживаемых диалектами в разные исторические периоды (Баранникова Л.И., «Основные сведения о языке», Изд. М Просвещение, 1982 г, стр.32.). Советская диалектология называла диалектом «разновидность данного языка, употребляемую в качестве средства общения лицами, связанными тесной территориальной, социальной или профессиональной общностью». Однако, при появлении фактора «этнического самосознания» и отличительного «самоназвания этнической общности», следует говорить уже не о диалекте, а о самостоятельном языке. Это цивилизованный международный подход к осмыслению проблемы. Так, например, сербохорватский язык является общим для двух самостоятельных народов сербского и хорватского, и в зависимости от того, кто на нем говорит (серб или хорват) этот язык носит название сербского или хорватского языка. А украинский (малороссийский), русский (великорусский), белорусский и поморский (северорусский) языки можно рассматривать, либо как диалекты древнерусского языка либо как самостоятельные восточно славянские языки. Таким образом, решающий отличительный фактор близкородственных языков от диалектов одного языка это «этнический фактор», при котором во главу угла ставится «единое самосознание, и локальное самосознание носителей локальных языковых единиц». Поморы в полной мере обладают таким самосознанием, и несмотря на навязываемую ассимиляцию на протяжении многих веков отделяют себя от великороссов. Русский (великороссийский), украинский и белорусский языки, по мнению ученых, образовались в XIV XV вв из восточнославянских диалектов, в результате появления и усиления территориальных различий в фонетике и морфологии. Очевидно, что существенные отличия в фонетике и морфологии от «великорусского языка» существуют и в помОрьской говОре, Следует также отметить, что ошибочное причисление поморской «говори» к «великоросским диалектам» нанесло колоссальный вред поморской культуре, так как отечественные филологи считали, что «при социализме диалекты превращаются в пережиточную категорию». А с пережитками, как известно, велась беспощадная борьба на государственном уровне. «В наше время в диалектах происходит не утрата отдельных особенностей, а перестройка всей системы», писали об этом сторонники языковой ассимиляции (БаранниковаЛ.И., «Основные сведения о языке», Изд. М Просвещение, 1982 г, стр.33). Очевидно, что подобное разрушение языка коренного населения совершенно недопустимо в правовом государстве. Учитывая, что этническое самосознание является решающим при отнесении языковой системы к диалекту или языку, имея документальное подтверждение наличия этнического самосознания у поморов (в виде результатов переписи населения 2002 года), учитывая стремление коренной этнической общности поморов сохранять и развивать языковые традиции своих предков, следует признать, что говОря, де-факто, является этническим языком общности поморов."],"sp":["В «Кратком словаре поморского языка» дано толкование ряда наиболее характерных поморских слов, сохранившихся в памяти нынешнего пожилого поколения, но стремительно исчезающих из языка поморской молодежи. В словаре в наиболее доступной для большинства читателей форме систематизированы основные нормы и отличительные особенности помОрьской говОри. Для облегчения восприятия слов вместо стандартных знаков ударения в нашем словаре ударные строчные гласные пишутся как прописные, например: ПомОрьска говОря. Это объясняется тем, что многие поморские слова по своему написанию напоминают русские слова, поэтому, не имея разговорного опыта, неподготовленный читатель может непроизвольно ставить ударения так, как это принято в русском языке. Как показала практика, нестандартное обозначение ударений путем подъема строчных согласных до прописных, позволяет читателю быстрее сориентироваться в том, где в процессе чтения нужно ставить ударение. Это нововведение, по признанию самих читателей, существенно облегчает чтение текстов на помОрьской говОре. Заголовочное слово в нашем словаре печатается с абзаца в начале словарной статьи. Ввиду краткости словаря, фонетические особенности с явлениями ассимиляции, упрощением и оглушением согласных, а так же грамматические формы слов приводятся не полностью. Однако в большинстве случаев заголовочные слова и иллюстративные примеры в нашем словаре содержат эти особенности. В ряде случаев, если слово многозначно, приводятся его значения. В большинстве случаев в скобках приведены иллюстративные примеры применения толкуемых слов. Для определения и для уточнения значения слова используется система отсылок, например: (см) смотри и (ср) сравни. Ввиду краткости словаря, этимология слов не приводится. В конце словаря приведены примеры живой речи поморов в виде кулойских сказок стАрин."]}</script>
<script>

function lev(a,b,m){if(Math.abs(a.length-b.length)>m)return m+1;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i],mn=i;for(let j=1;j<=b.length;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c.push(v);if(v<mn)mn=v}if(mn>m)return m+1;p=c}return p[b.length]}

function search(raw){
 const qn=norm(raw),qp=ph(raw);if(!qn)return[];
 const ws=qn.split(/\s+/).filter(w=>w.length>1).map(stem);const res=[];
 for(const e of E){let s=0,t=0;
  for(let k=0;scope!=='d'&&k<e.hn.length;k++){const a=e.hn[k],b=e.hp[k];let v=0;
   if(a===qn)v=100;else if(b===qp)v=92;else if(a.startsWith(qn))v=80-(a.length-qn.length)*.5;else if(b.startsWith(qp))v=72-(b.length-qp.length)*.5;
   else if(qn.length>2&&a.includes(qn))v=55;else if(qp.length>2&&b.includes(qp))v=50;
   if(v>s){s=v;t=1}}
  if(scope!=='d'&&s<50&&qp.length>=4){const m=qp.length>7?2:1;let best=9;for(const b of e.hp){const d=lev(b,qp,m);if(d<best)best=d;if(b.length>qp.length+1){const d2=lev(b.slice(0,qp.length),qp,m);if(d2<best)best=d2+.5}}
   if(best<=m+.5){const v=44-best*9;if(v>s){s=v;t=2}}}
  if(scope!=='w'&&s<46&&ws.length&&ws.every(w=>e.dd.includes(w))){const whole=qn.split(/\s+/).every(w=>(' '+e.dd.replace(/[^а-я0-9]+/g,' ')+' ').includes(' '+w+' '));const v=whole?(e.dd.startsWith(qn)?48:44):30;if(v>s){s=v;t=3}}
  if(s>0)res.push({e,s,t})}
 return res.sort((a,b)=>b.s-a.s||a.e.w.length-b.e.w.length||a.e.w.localeCompare(b.e.w,'ru'));
